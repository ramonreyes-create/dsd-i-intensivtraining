<!doctype html>
<html lang="de" class="notranslate" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="google" content="notranslate">
  <meta http-equiv="Content-Language" content="de">
  <title>DSD I - Hörverstehen - Modellsatz 7</title>
  <style>
    :root{--navy:#173759;--blue:#2e6db0;--light:#edf4fb;--line:#ccd7e3;--ink:#172235;--green:#16734b;--red:#b32e35;--gold:#f4b241}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#eaf0f6;color:var(--ink);font:16px/1.5 Arial,sans-serif}
    button,input,select{font:inherit}.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:18px;padding:14px 24px;background:var(--navy);color:#fff;box-shadow:0 3px 15px #102a4433}.top h1{margin:0;font-size:1.2rem}.progress{font-weight:800}.shell{width:min(1120px,calc(100% - 28px));margin:24px auto 60px}.intro,.part{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 7px 24px #17375912}.intro{padding:24px}.intro-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.intro input{width:100%;padding:12px;border:1.5px solid #b4c4d5;border-radius:10px}.notice{margin-top:16px;padding:13px 15px;background:#fff7e4;border-left:5px solid var(--gold);border-radius:8px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.nav a{text-decoration:none;color:var(--navy);font-weight:800;background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 13px}.part{padding:24px;margin:18px 0;scroll-margin-top:86px}.part-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;border-bottom:2px solid var(--light);padding-bottom:15px}.part h2{margin:0;color:var(--navy)}.muted{color:#647386}.audio-box{margin:17px 0;padding:16px;background:var(--light);border-radius:12px}.audio-line{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.play{border:0;border-radius:9px;padding:10px 15px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer}.play:disabled{background:#8796a6;cursor:not-allowed}.audio-status{font-weight:700}.bar{height:8px;margin-top:12px;background:#d2dce8;border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;width:0;background:var(--blue)}.sheet-image{display:block;width:100%;max-height:980px;object-fit:contain;margin:15px auto;border:1px solid var(--line);border-radius:10px;background:#fff}.questions{display:grid;gap:12px;margin-top:18px}.question{padding:15px;border:1px solid var(--line);border-radius:12px;background:#fbfcfe}.question b{display:block;margin-bottom:9px}.choices{display:grid;gap:7px}.choices label{display:flex;gap:9px;align-items:flex-start;padding:7px 9px;border-radius:8px}.choices label:hover{background:var(--light)}input[type=radio]{margin-top:4px;transform:scale(1.15)}.compact-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.compact-grid .question{text-align:center}.compact-grid .choices{grid-template-columns:repeat(3,1fr)}.compact-grid .choices label{justify-content:center}.family-list{columns:2;column-gap:35px;padding-left:0;list-style:none}.family-list li{break-inside:avoid;margin:7px 0}.answer-select{width:130px;padding:9px;border:1.5px solid #b4c4d5;border-radius:9px}.submit-panel{position:sticky;bottom:12px;z-index:15;display:flex;align-items:center;justify-content:space-between;gap:15px;margin-top:22px;padding:15px 18px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 28px #17375928}.submit{border:0;border-radius:10px;padding:12px 18px;background:var(--green);color:#fff;font-weight:800;cursor:pointer}.status{font-weight:800}.ok{color:var(--green)}.error{color:var(--red)}
    .start-screen,.warning-screen{position:fixed;inset:0;z-index:100;background:#102a44f2;display:grid;place-items:center;padding:22px}.start-card,.warning-card{width:min(610px,100%);background:#fff;border-radius:18px;padding:30px;box-shadow:0 20px 70px #0006}.start-card h2,.warning-card h2{margin-top:0;color:var(--navy)}.start-card input{width:100%;padding:12px;margin:6px 0 12px;border:1.5px solid #b4c4d5;border-radius:10px}.start-card button,.warning-card button{width:100%;border:0;border-radius:10px;padding:13px;background:var(--gold);font-weight:900;cursor:pointer}.warning-screen{display:none}.warning-card{border-top:8px solid var(--red)}
    @media(max-width:760px){.top{align-items:flex-start}.intro-grid,.compact-grid{grid-template-columns:1fr}.compact-grid .choices{grid-template-columns:repeat(3,1fr)}.family-list{columns:1}.part{padding:18px}.submit-panel{align-items:flex-start;flex-direction:column}.sheet-image{max-height:none}}
    @media print{.top,.nav,.audio-box,.submit-panel,.start-screen,.warning-screen{display:none!important}.shell{width:100%;margin:0}.part,.intro{box-shadow:none;break-inside:avoid}}
    .study-tools{position:sticky;top:55px;z-index:19;margin:0 0 16px;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:0 6px 20px #17375922}.tool-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.tool-label{font-weight:900;color:var(--navy);margin-right:2px}.mark-btn,.tool-btn{border:1px solid #9fb2c5;border-radius:9px;padding:8px 11px;background:#fff;font-weight:800;cursor:pointer}.mark-btn{width:38px;height:38px;padding:0}.mark-btn[data-color="#ffe66d"]{background:#ffe66d}.mark-btn[data-color="#9be7a5"]{background:#9be7a5}.mark-btn[data-color="#9fd8ff"]{background:#9fd8ff}.mark-btn[data-color="#ffb6d9"]{background:#ffb6d9}.mark-btn:hover,.tool-btn:hover{outline:3px solid #2e6db033}.note-panel{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}.note-panel.open{display:block}.note-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}.note-head select{width:auto;min-width:130px;padding:8px;border:1px solid #aabdd0;border-radius:8px}.note-panel textarea{width:100%;min-height:100px;resize:vertical;padding:10px;border:1.5px solid #aabdd0;border-radius:9px}.note-meta{display:flex;justify-content:space-between;gap:12px;margin-top:5px;color:var(--muted);font-size:.85rem}.student-mark{border-radius:3px;padding:0 .04em}.tool-message{font-size:.86rem;font-weight:700;color:var(--blue)}
  </style>
</head>
<body>
  <div class="start-screen" id="startScreen">
    <div class="start-card">
      <h2>DSD I - Hörverstehen</h2>
      <p>Trage deinen Namen und deine Klasse ein. Danach startet die Prüfung im Vollbildmodus.</p>
      <label for="studentName"><b>Vor- und Nachname</b></label>
      <input id="studentName" autocomplete="name" maxlength="120">
      <label for="studentCourse"><b>Klasse / Kurs</b></label>
      <input id="studentCourse" maxlength="80">
      <p class="muted">Jeder Audioteil kann nur einmal gestartet werden. Die in der Aufnahme vorgesehenen Wiederholungen sind bereits enthalten.</p>
      <button type="button" onclick="beginExam()">Prüfung im Vollbild starten</button>
      <p class="status error" id="startError"></p>
    </div>
  </div>


  <div class="warning-screen" id="warningScreen">
    <div class="warning-card">
      <h2>Achtung: Vollbildmodus verlassen</h2>
